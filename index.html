/* 极淡蒙版，只为让白字可读；删掉这行就是完全原图 */
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(150,175,205,.08)}

.app{height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 10px)}

header{flex:none;text-align:center;margin-bottom:14px}
h1{font-size:30px;font-weight:700;letter-spacing:1.2px;text-shadow:0 2px 12px rgba(50,75,115,.5)}

/* 周切换 */
.weekbar{
  flex:none;margin:0 16px;display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:18px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 6px 22px rgba(40,60,100,.2);
}
.nav{
  width:42px;height:42px;flex:none;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2);color:#fff;
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.nav:active{transform:scale(.92);background:rgba(255,255,255,.38)}
.nav[disabled]{opacity:.28;pointer-events:none}
.range{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:.5px;text-shadow:0 1px 6px rgba(30,50,90,.35)}

/* 照片区：占满剩余屏幕 */
.stage{
  flex:1;min-height:0;margin:14px 16px 0;border-radius:24px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 36px rgba(30,50,90,.28);
  cursor:pointer;
}
.stage img.week{width:100%;height:100%;object-fit:cover;display:block;animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* 空状态：只有一个很淡的 + ，无文字 */
.plus{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:200;color:rgba(255,255,255,.55);
}
.plus span{
  width:78px;height:78px;border:2px dashed rgba(255,255,255,.6);border-radius:50%;
  display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:4px;
}
.stage:active .plus span{transform:scale(.94)}

/* 底部：操作按钮 + 日期角标 */
.foot{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:26px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.16));
  pointer-events:none;
}
.foot.on{background:linear-gradient(180deg,rgba(20,35,60,0),rgba(20,35,60,.22))}
.tools{display:flex;gap:10px;pointer-events:auto}
.tool{
  height:36px;padding:0 16px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.24);color:#fff;
  font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.tool:active{transform:scale(.94);background:rgba(255,255,255,.4)}
.badge{
  font-size:12px;letter-spacing:.6px;padding:6px 13px;border-radius:13px;
  background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}

/* 全屏查看 */
.viewer{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(140,165,200,.4);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);padding:22px;
}
.viewer.on{display:flex;animation:fade .24s ease}
.viewer img{max-width:100%;max-height:84vh;object-fit:contain;border-radius:16px;box-shadow:0 20px 60px rgba(20,40,80,.45)}
.closev{
  position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;
  width:42px;height:42px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.22);color:#fff;font-size:19px;
}
input[type=file]{display:none}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);
  background:rgba(25,40,65,.88);color:#fff;padding:10px 18px;border-radius:16px;font-size:13px;
  display:none;z-index:99;backdrop-filter:blur(8px);
}
</style>
</head>
<body>
<div class="app">
  <header><h1>Daily Courses</h1></header>

  <div class="weekbar">
    <button class="nav" id="prev">‹</button>
    <div class="range" id="rangeText">—</div>
    <button class="nav" id="next">›</button>
  </div>

  <div class="stage" id="stage">
    <div class="plus" id="plus"><span>＋</span></div>
    <div class="foot" id="foot">
      <div class="tools" id="tools" style="display:none">
        <button class="tool" id="replace">↻ Replace</button>
        <button class="tool" id="del">✕ Delete</button>
      </div>
      <div class="badge" id="badge"></div>
    </div>
    <input type="file" id="file" accept="image/*">
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="closev" id="closev">✕</button>
  <img id="viewImg" alt="">
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY = "dailyCoursesWeeks";
  var stage   = document.getElementById("stage");
  var plus    = document.getElementById("plus");
  var foot    = document.getElementById("foot");
  var tools   = document.getElementById("tools");
  var badge   = document.getElementById("badge");
  var file    = document.getElementById("file");
  var viewer  = document.getElementById("viewer");
  var toastEl = document.getElementById("toast");

  var cursor = mondayOf(new Date());
  var store  = load();

  function mondayOf(d){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - day);
    return x;
  }
  function keyOf(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ toast("Storage full — delete an old week first"); }
  }
  function toast(t){
    toastEl.textContent = t; toastEl.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.style.display="none"; }, 1900);
  }
  function fmt(d){ return (d.getMonth()+1) + "/" + d.getDate(); }

  function compress(dataUrl, max){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > max || h > max){ var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ res(c.toDataURL("image/jpeg", 0.78)); }catch(e){ rej(e); }
      };
      img.onerror = rej;
      img.src = dataUrl;
    });
  }
  function readFile(f){
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload  = function(e){ res(e.target.result); };
      r.onerror = rej;
      r.readAsDataURL(f);
    });
  }

  function render(){
    var thisMon = mondayOf(new Date());
    var k = keyOf(cursor);
    var sun = new Date(cursor.getTime()); sun.setDate(sun.getDate() + 6);
    var isThis = (k === keyOf(thisMon));
    var has = !!store[k];

    document.getElementById("rangeText").textContent =
      fmt(cursor) + " – " + fmt(sun) + " " + sun.getFullYear();

    badge.innerHTML = (isThis ? '<span class="dot"></span>THIS WEEK · ' : '') + k;

    document.getElementById("prev").disabled = (cursor <= new Date(2020,0,1));
    document.getElementById("next").disabled = (cursor >= thisMon);

    // 清掉旧的照片节点，避免叠加
    var olds = stage.querySelectorAll("img.week");
    for (var i=0;i<olds.length;i++){ stage.removeChild(olds[i]); }

    if (has){
      plus.style.display = "none";
      tools.style.display = "flex";
      foot.classList.add("on");
      var im = new Image();
      im.className = "week";
      im.src = store[k];
      im.alt = k;
      im.addEventListener("click", openViewer);
      stage.insertBefore(im, foot);
    } else {
      plus.style.display = "flex";
      tools.style.display = "none";
      foot.classList.remove("on");
    }
  }

  function addPhoto(f){
    if (!f) return;
    readFile(f)
      .then(function(d){ return compress(d, 1400); })
      .then(function(small){
        store[keyOf(cursor)] = small;
        save();
        render();
        toast("Saved");
      })
      .catch(function(){ toast("Couldn't read that image"); });
  }

  // 点空处 = 选图；点已有照片 = 全屏
  stage.addEventListener("click", function(e){
    if (store[keyOf(cursor)]){
      if (!e.target.closest(".tools")) openViewer();
    } else {
      file.click();
    }
  });
  plus.addEventListener("click", function(){ file.click(); });
  document.getElementById("replace").addEventListener("click", function(e){ e.stopPropagation(); file.click(); });
  document.getElementById("del").addEventListener("click", function(e){
    e.stopPropagation();
    if (confirm("Delete this week's photo?")){
      delete store[keyOf(cursor)]; save(); render(); toast("Deleted");
    }
  });
  file.addEventListener("change", function(e){
    addPhoto(e.target.files && e.target.files[0]);
    file.value = "";
  });

  function openViewer(){
    document.getElementById("viewImg").src = store[keyOf(cursor)];
    viewer.classList.add("on");
  }
  function closeViewer(){ viewer.classList.remove("on"); }
  document.getElementById("closev").addEventListener("click", closeViewer);
  viewer.addEventListener("click", function(e){ if (e.target === viewer) closeViewer(); });

  document.getElementById("prev").addEventListener("click", function(){
    cursor = new Date(cursor.getTime()); cursor.setDate(cursor.getDate() - 7); render();
  });
  document.getElementById("next").addEventListener("click", function(){
    if (cursor < mondayOf(new Date())){
      cursor = new Date(cursor.getTime()); cursor.setDate(cursor.getDate() + 7); render();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeViewer();
    if (viewer.classList.contains("on")) return;
    if (e.key === "ArrowLeft")  document.getElementById("prev").click();
    if (e.key === "ArrowRight") document.getElementById("next").click();
  });

  var x0 = null;
  document.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null || viewer.classList.contains("on")) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) < 60) return;
    if (dx < 0) document.getElementById("next").click(); else document.getElementById("prev").click();
  }, {passive:true});

  render();
})();
</script>
</body>
</html>
